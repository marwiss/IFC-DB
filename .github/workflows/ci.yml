name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check ifc_lpg

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # The graph side imports with none of the extras, as a server's own process uses it.
      - run: uv sync --no-dev
      - run: uv run --no-sync python -c "import ifc_lpg.editing, ifc_lpg.exporter, ifc_lpg.files, ifc_lpg.graph, ifc_lpg.ids, ifc_lpg.ifcx, ifc_lpg.importer, ifc_lpg.lossless, ifc_lpg.merge, ifc_lpg.paths, ifc_lpg.prepare, ifc_lpg.spatial, ifc_lpg.step, ifc_lpg.validation"
      - run: uv sync --all-extras
      - run: uv run pytest -m "not integration"

  integration:
    name: The round trip on Neo4j and Memgraph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest -q -m integration
        env:
          IFC_LPG_TEST_MEMGRAPH: "1"
      # IfcOpenShell's EXPRESS rules import pytest at run time; the extra has it without the dev group.
      - run: uv run --no-dev --extra ifcopenshell python -m ifc_lpg.validation tests/fixtures/three_walls_gtin.ifc
