name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check ifc_db

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # The graph side imports with none of the extras, as a server's own process uses it.
      - run: uv sync --no-dev
      - run: uv run --no-sync python -c "import ifc_db.editing, ifc_db.exporter, ifc_db.files, ifc_db.graph, ifc_db.ids, ifc_db.ifcx, ifc_db.ifcx_check, ifc_db.importer, ifc_db.lossless, ifc_db.merge, ifc_db.paths, ifc_db.prepare, ifc_db.queries, ifc_db.spatial, ifc_db.step, ifc_db.validation"
      - run: uv sync --all-extras
      - run: uv run pytest -m "not integration"

  integration:
    name: The round trip on Neo4j and Memgraph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest -q -m integration --ignore=tests/test_snapshots.py
        env:
          IFC_DB_TEST_MEMGRAPH: "1"
      # IfcOpenShell's EXPRESS rules import pytest at run time; the extra has it without the dev group.
      - run: uv run --no-dev --extra ifcopenshell python -m ifc_db.validation tests/fixtures/three_walls_gtin.ifc

  snapshots:
    name: The snapshots on Neo4j and Memgraph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest -q -m integration tests/test_snapshots.py
        env:
          IFC_DB_TEST_MEMGRAPH: "1"
